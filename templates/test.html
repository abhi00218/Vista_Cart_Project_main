{% load static %}

<!DOCTYPE html>
<html class="no-js" lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="x-ua-compatible" content="ie=edge" />
    <title>Dummy text</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <!-- Favicon -->
    <link rel="shortcut icon" type="image/x-icon" href="{% static 'main_asset/images/favicon.png' %}" />

    <link rel="stylesheet" href="{% static 'main_asset/css/bootstrap.css' %}" />
    <link rel="stylesheet" href="{% static 'main_asset/css/vendor/font-awesome.min.css' %}" />
    <link rel="stylesheet" href="{% static 'main_asset/css/animate.css' %}" />
    <link rel="stylesheet" href="{% static 'main_asset/css/swiper-bundle.min.css' %}" />
    <link rel="stylesheet" href="{% static 'main_asset/css/style.css' %}" />
  </head>
  <body>



    <div class="new-product-area section-padding-2">
        <div class="container">
          <div class="row">
            <div class="col-lg-12 col-md-12 col-sm-12">
              <div class="section-title">
                <h2 class="title">WHAT'S HOT</h2>
              </div>
            </div>
          </div>
          <div class="product-wrapper">
            <div class="swiper-container product-active">
              <div class="swiper-wrapper">
                <div class="swiper-slide">
                  <div class="single-product">
                    <div class="product-image">
                      <a href="javascript:void(0);">
                        <img src="/static/assets/img/product-1.jpg">
                      </a>
                      
                      <div class="action-links">
                        <ul>
                          <li>
                            <a
                              href="javascript:void(0);"
                              data-tooltip="tooltip"
                              data-placement="left"
                              title="Add to cart"
                              ><i class="icon-shopping-bag"></i
                            ></a>
                          </li>
                          <li>
                            <a
                              href="javascript:void(0);"
                              data-tooltip="tooltip"
                              data-placement="left"
                              title="Add to Wishlist"
                              ><i class="icon-heart"></i
                            ></a>
                          </li>
                        </ul>
                      </div>
                    </div>
                    <div class="product-content">
                      <div class="color-swetch-box">
                        <div class="color-img">
                          <span class="first-img">
                            <img
                              src="/static/assets/images/product/product-1.jpg"
                              alt="8"
                            />
                          </span>
                          <span class="sec-img">
                            <img
                              src="/static/assets/images/product/product-2.jpg"
                              alt="7"
                            />
                          </span>
                          <span class="third-img">
                            <img
                              src="/static/assets/images/product/product-3.jpg"
                              alt="6"
                            />
                          </span>
                        </div>
                        <div class="swatches_count">3 Color</div>
                      </div>

                      <h4 class="product-name">
                        <a href="javascript:void(0);">Dummy product name</a>
                      </h4>
                      <p class="product-description">
                        The new collection co-created with our collective.
                      </p>
                      <div class="price-box">
                        <span class="current-price">$19.00</span>
                        <span class="old-price">$29.00</span>
                      </div>
                    </div>
                  </div>

                </div>



                <div class="swiper-slide">
                  <div class="single-product">
                    <div class="product-image">
                      <a href="javascript:void(0);">
                        <img src="/static/assets/img/product-1.jpg">
                      </a>
                      
                      <div class="action-links">
                        <ul>
                          <li>
                            <a
                              href="javascript:void(0);"
                              data-tooltip="tooltip"
                              data-placement="left"

                          </li>
                          <li>
                            <a
                              href="javascript:void(0);"
                              data-tooltip="tooltip"
                              data-placement="left"
                              title="Add to Wishlist"
                              ><i class="icon-heart"></i
                            ></a>
                          </li>
                        </ul>
                      </div>
                    </div>
                    <div class="product-content">
                      <div class="color-swetch-box">
                        <div class="color-img">
                          <span class="first-img">
                            <img
                              src="/static/assets/images/product/product-1.jpg"
                              alt="8"
                            />
                          </span>
                          <span class="sec-img">
                            <img
                              src="/static/assets/images/product/product-2.jpg"
                              alt="7"
                            />
                          </span>
                          <span class="third-img">
                            <img
                              src="/static/assets/images/product/product-3.jpg"
                              alt="6"
                            />
                          </span>
                        </div>
                        <div class="swatches_count">3 Color</div>
                      </div>

                      <h4 class="product-name">
                        <a href="javascript:void(0);">Dummy product name</a>
                      </h4>
                      <p class="product-description">
                        The new collection co-created with our collective.
                      </p>
                      <div class="price-box">
                        <span class="current-price">$19.00</span>
                        <span class="old-price">$29.00</span>
                      </div>
                    </div>
                  </div>

                </div>

                 

              <!-- Add Arrows -->
              <div class="swiper-next"><i class="fa fa-angle-right"></i></div>
              <div class="swiper-prev"><i class="fa fa-angle-left"></i></div>
            </div>

            
          </div>
        </div>
      </div>
    </div>













    <script src="/static/main_asset/js/jquery-3.3.1.min.js"></script>
    <script src="/static/main_asset/js/popper.min.js"></script>
    <script src="/static/main_asset/js/nav-drop.js"></script>
