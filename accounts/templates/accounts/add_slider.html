{% extends "accounts/admin_base.html" %}

{% block content %}

<main id="main" class="main">

    <section class="section">
        <div class="row">
            <div class="col-lg-12">

                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Add Banner</h5>

                        <!-- No Labels Form -->
                        <form class="row g-3" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="col-md-6">
                                <label for="inputText" class="col-sm-2 col-form-label">Title<span class="text-danger">*</span></label>
                                {{ form.title }}
                            </div>
                            <div class="col-md-6">
                                <label for="inputText" class="col-sm-2 col-form-label">Sub-Title</label>
                                {{ form.subtitle }}
                            </div>
                            <div class="col-md-6">
                                <label for="image" class="col-sm-2 col-form-label">Image<span class="text-danger">*</span></label>
                                {{ form.image }}
                            </div>
                            <div class="col-6">
                                <label for="inputText" class="col-sm-4 col-form-label">Button Text<span class="text-danger">*</span></label>
                                {{ form.button_text }}
                            </div>
                            <div class="col-md-12">
                                <label for="id_select_section" class="form-label">Select Section<span class="text-danger">*</span></label>
                                {{ form.select_section }} <!-- No need for add_class filter -->
                            </div> 
                            <div class="col-md-12">
                                <label for="formText" class="form-label">Description<span class="text-danger">*</span></label>
                                {{ form.description }}
                            </div>

                            <div class="">
                                <button type="submit" class="btn btn-primary">Save</button>
                            </div>
                        </form><!-- End No Labels Form -->

                    </div>
                </div>
            </div>
        </div>
        </div>
    </section>
</main>


{% endblock %}
