{% extends "accounts/admin_base.html" %}
{% block content %}
<main id="main" class="main">
    <h1 class="mb-4">Edit Slider</h1>

    <section class="section">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">General Form Elements</h5>

                        <!-- Slider Form -->
                        <form class="row g-3" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="col-md-6">
                                <label for="inputText" class="col-sm-2 col-form-label">Title</label>
                                {{ form.title }}
                            </div>
                            <div class="col-md-6">
                                <label for="inputText" class="col-sm-2 col-form-label">Sub-Title</label>
                                {{ form.subtitle }}
                            </div>
                            <div class="col-md-6">
                                <label for="image" class="col-sm-2 col-form-label">Image</label>
                                {{ form.image }}
                            </div>
                            <div class="col-6">
                                <label for="inputText" class="col-sm-3 col-form-label">Button Text</label>
                                {{ form.button_text }}
                            </div>
                            <div class="col-md-12">
                                <label for="id_select_section" class="form-label">Select Section</label>
                                {{ form.select_section }} <!-- No need for add_class filter -->
                            </div> 
                            <div class="col-md-12">
                                <label for="formText" class="form-label">Description</label>
                                {{ form.description }}
                            </div>

                            <div class="">
                                <button type="submit" class="btn btn-primary">Save changes</button>
                            </div>
                        </form>

                        <!-- Back link -->

                    </div>
                </div>
            </div>
        </div>
        
        </div>
    </section>
</main>
{% endblock content %}
