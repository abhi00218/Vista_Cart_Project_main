{% extends "accounts/admin_base.html" %}
{% block content %}
<main id="main" class="main">
    <h1 class="mb-4">Edit Slider</h1>

    <section class="section">
        <div class="row">
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">General Form Elements</h5>

                        <!-- Slider Form -->
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}



                            <div class="mb-3">
                                <label for="id_image" class="form-label">Slider Image</label>
                                {{ form.image }} <!-- No need for add_class filter -->
                            </div>

                            <div class="mb-3">
                                <label for="id_title" class="form-label">Title</label>
                                {{ form.title }} <!-- No need for add_class filter -->
                            </div>

                            <div class="mb-3">
                                <label for="id_subtitle" class="form-label">Subtitle</label>
                                {{ form.subtitle }} <!-- No need for add_class filter -->
                            </div>

                            <div class="mb-3">
                                <label for="id_description" class="form-label">Description</label>
                                {{ form.description }} <!-- No need for add_class filter -->
                            </div>

                            <div class="mb-3">
                                <label for="id_button_text" class="form-label">Button Text</label>
                                {{ form.button_text }} <!-- No need for add_class filter -->
                            </div>

                            <div class="mb-3">
                                <label for="id_button_link" class="form-label">Button Link</label>
                                {{ form.button_link }} <!-- No need for add_class filter -->
                            </div>

                            <!-- New section field -->
                            <div class="mb-3">
                                <label for="id_select_section" class="form-label">Select Section</label>
                                {{ form.select_section }} <!-- No need for add_class filter -->
                            </div>

                            <!-- Submit Button -->
                            <button type="submit" class="btn btn-primary">Save Changes</button>
                            <a href="{% url 'slider-view' %}" class="btn btn-secondary">View Sliders</a>
                        </form>


                        <!-- Back link -->

                    </div>
                </div>
            </div>
        </div>
        </div>
    </section>
</main>
{% endblock content %}
